# R64 Coconut run (Qwen3.5 + LoRA r64) — canonical fresh-run config.
# Same file as args/gsm_coconut.yaml (kept in sync); this alias exists so the
# grid reads as r16 / r64 / cot with one obvious file per run.
# Eval is 50 examples every 3 epochs because that is what r64 actually ran
# (see logs/r64_run_log.txt) — r16 and the CoT baseline match it for a
# like-for-like comparison. (Eval loss still runs every epoch; only
# generate-accuracy is every 3rd: epochs 3, 6, 9. Epoch 10/stage 3 gets no
# generate-eval unless the code forces a final eval — accepted for this grid;
# changing it would need all runs redone together.)
# Launch FRESH into an EMPTY /kaggle/working/checkpoints_r64:
#   rm -rf /kaggle/working/checkpoints_r64 && mkdir -p /kaggle/working/checkpoints_r64
#   python run_single_gpu.py args/gsm_coconut_r64.yaml
# (auto-resume picks up any checkpoint_* already in save_path/name, so a
# non-empty dir would silently resume the old partial run instead of starting fresh.)
# 500-example subset: build once on Kaggle from the full converted set:
#   python -c "import json,random; random.seed(0); d=json.load(open('data/gsm_train.json')); random.shuffle(d); json.dump(d[:500], open('data/gsm_train_500.json','w'))"
# Eval set is the full data/gsm_valid.json with generate-eval capped at 50.

project: coconut
save_path: /kaggle/working/checkpoints_r64
name: gsm-coconut-r64

only_eval: False

coconut: True
cot: False
no_thoughts: False
no_cot: False

c_thought: 2
epochs_per_stage: 3
max_latent_stage: 3
pad_latent_to_max: True

save_only_improve: False
uniform_prob: 0.0
model_id: huihui-ai/Huihui-Qwen3.5-4B-Claude-4.6-Opus-abliterated
load_model_path: "None"
seed: 0
resume: 0
bf16: true
train_path: data/gsm_train_500.json
val_path: data/gsm_valid.json
reset_optimizer: True
batch_size_training: 1
debug: false
gradient_accumulation_steps: 1
num_epochs: 10
lr: !!float "1e-4"
wandb_mode: disabled
weight_decay: 0.01
use_lora: true
lora_r: 64
lora_alpha: 128
clip_grad_norm: 1.0
save_every_n_steps: 250
eval_every_n_epochs: 3
eval_max_examples: 50
