# R16 Coconut run (Qwen3.5 + LoRA r16) — matches the r64 config except rank.
# Same 500-example train subset, same full valid set, same 10 epochs, same
# eval settings. Unique save dir (checkpoints_r16) so epoch-based
# auto-resume can never cross-load another run's checkpoint_* files.
# Build the subset once on Kaggle (seed 0, first 500 after shuffle):
#   python -c "import json,random; random.seed(0); d=json.load(open('data/gsm_train.json')); random.shuffle(d); json.dump(d[:500], open('data/gsm_train_500.json','w'))"

project: coconut
save_path: /kaggle/working/checkpoints_r16
name: gsm-coconut-r16

only_eval: False

coconut: True
cot: False
no_thoughts: False
no_cot: False

c_thought: 2
epochs_per_stage: 3
max_latent_stage: 3
pad_latent_to_max: True

save_only_improve: False
uniform_prob: 0.0
model_id: huihui-ai/Huihui-Qwen3.5-4B-Claude-4.6-Opus-abliterated
load_model_path: "None"
seed: 0
resume: 0
bf16: true
train_path: data/gsm_train_500.json
val_path: data/gsm_valid.json
reset_optimizer: True
batch_size_training: 1
debug: false
gradient_accumulation_steps: 1
num_epochs: 10
lr: !!float "1e-4"
wandb_mode: disabled
weight_decay: 0.01
use_lora: true
lora_r: 16
lora_alpha: 32
clip_grad_norm: 1.0
save_every_n_steps: 250
eval_every_n_epochs: 1
eval_max_examples: 200
